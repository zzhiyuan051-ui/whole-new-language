<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>洄文 · Chromium 字体回退测试</title>
<style>
  body { font-size: 30px; margin: 24px; line-height: 1.9; font-family: "Microsoft YaHei"; }
  .lbl { font-size: 15px; color: #888; font-family: "Microsoft YaHei"; }
  .box { border: 1px solid #ddd; padding: 10px 16px; margin: 8px 0 18px; }
  .pua { font-size: 44px; }
  /* 1 默认（微软雅黑，不指定） */
  .t1 { }
  /* 2 明确指定一个不含私用区的西文字体 */
  .t2 { font-family: Consolas, monospace; }
  /* 3 明确指定我们的字体 */
  .t3 { font-family: "GalHuiwen"; }
</style>
</head>
<body>
  <div class="lbl">测试字符：U+E3F5 U+E14C U+E409（我 爱 你）</div>

  <div class="lbl">① 默认字体（Microsoft YaHei）—— 靠字体回退</div>
  <div class="box t1 pua">&#xE3F5;&#xE14C;&#xE409;</div>

  <div class="lbl">② font-family: Consolas —— 西文等宽，靠回退</div>
  <div class="box t2 pua">&#xE3F5;&#xE14C;&#xE409;</div>

  <div class="lbl">③ font-family: GalHuiwen —— 直接指定我们的字体</div>
  <div class="box t3 pua">&#xE3F5;&#xE14C;&#xE409;</div>

  <div class="lbl">④ 对照：正常汉字（应该始终能显示）</div>
  <div class="box pua">我爱你</div>
</body>
</html>
